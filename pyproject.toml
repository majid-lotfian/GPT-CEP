[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-cep"
version = "0.2.0"
description = "LLM-assisted CEP rule generation and adaptive threshold refinement"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3"]

[project.optional-dependencies]
llm = ["openai>=1.0,<3"]
test = ["pytest>=8"]

[project.scripts]
gpt-cep = "gpt_cep.cli:main"

[tool.setuptools.packages.find]
include = ["gpt_cep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
